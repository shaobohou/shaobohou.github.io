name: Blog Homepage Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '_posts/**'
      - '_layouts/**'
      - 'index.html'
      - '_config.yml'
      - 'assets/**'
      - '.github/workflows/blog-preview.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: false

      - name: Install Jekyll and dependencies
        run: |
          gem install bundler jekyll
          bundle init
          bundle add jekyll
          bundle install

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev playwright
          npx playwright install chromium --with-deps

      - name: Start local server and capture screenshot
        run: |
          # Start Jekyll server in background
          bundle exec jekyll serve --no-watch --skip-initial-build &
          SERVER_PID=$!

          # Wait for server to be ready
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -s http://localhost:4000 > /dev/null; then
              echo "Server is ready!"
              break
            fi
            sleep 1
          done

          # Take screenshot using Playwright
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.setViewportSize({ width: 1280, height: 800 });
            await page.goto('http://localhost:4000', { waitUntil: 'networkidle' });
            await page.screenshot({ path: 'homepage-preview.png', fullPage: true });
            await browser.close();
          })();
          "

          # Stop server
          kill $SERVER_PID

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: homepage-preview
          path: homepage-preview.png
          retention-days: 30

      - name: Post preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.payload.pull_request.number;

            // Read the screenshot and convert to base64
            const screenshot = fs.readFileSync('homepage-preview.png');
            const base64Screenshot = screenshot.toString('base64');

            // Find existing preview comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🎨 Blog Homepage Preview')
            );

            const commentBody = `## 🎨 Blog Homepage Preview

            Here's how the homepage will look with your changes:

            ![Homepage Preview](data:image/png;base64,${base64Screenshot})

            <details>
            <summary>📊 Preview Information</summary>

            - **PR**: #${prNumber}
            - **Commit**: ${context.payload.pull_request.head.sha.substring(0, 7)}
            - **Generated**: ${new Date().toISOString()}

            </details>

            > 💡 This preview is automatically generated when changes are made to posts, layouts, or the homepage.
            `;

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
            }
