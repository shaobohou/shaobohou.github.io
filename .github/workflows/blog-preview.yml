name: Blog Homepage Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '_posts/**'
      - '_layouts/**'
      - 'index.html'
      - '_config.yml'
      - 'assets/**'
      - '.github/workflows/blog-preview.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: false

      - name: Install Jekyll and dependencies
        run: |
          gem install bundler jekyll
          bundle init
          bundle add jekyll
          bundle install

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev playwright
          npx playwright install chromium --with-deps

      - name: Start local server and capture screenshot
        run: |
          # Start Jekyll server in background
          bundle exec jekyll serve --no-watch --skip-initial-build &
          SERVER_PID=$!

          # Wait for server to be ready
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -s http://localhost:4000 > /dev/null; then
              echo "Server is ready!"
              break
            fi
            sleep 1
          done

          # Take screenshot using Playwright
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.setViewportSize({ width: 1280, height: 800 });
            await page.goto('http://localhost:4000', { waitUntil: 'networkidle' });
            await page.screenshot({ path: 'homepage-preview.png', fullPage: true });
            await browser.close();
          })();
          "

          # Stop server
          kill $SERVER_PID

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: homepage-preview
          path: homepage-preview.png
          retention-days: 30

      - name: Get PR number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber;
            if (context.payload.pull_request) {
              prNumber = context.payload.pull_request.number;
            } else {
              // Find PR for current branch
              const branch = context.ref.replace('refs/heads/', '');
              const { data: prs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${branch}`,
                state: 'open'
              });
              if (prs.length === 0) {
                core.setFailed('No open PR found for this branch');
                return;
              }
              prNumber = prs[0].number;
            }
            core.setOutput('number', prNumber);
            return prNumber;

      - name: Upload preview to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Copy screenshot to temp location outside git tree
          cp homepage-preview.png /tmp/homepage-preview.png

          # Try to fetch and checkout the preview-images branch
          if git fetch origin preview-images 2>/dev/null; then
            git checkout -B preview-images origin/preview-images
          else
            # Branch doesn't exist, create it as orphan
            git checkout --orphan preview-images
            git rm -rf . 2>/dev/null || true
          fi

          # Create directory for this PR
          mkdir -p pr-${{ steps.pr.outputs.number }}

          # Copy screenshot from temp location
          cp /tmp/homepage-preview.png pr-${{ steps.pr.outputs.number }}/homepage-preview.png

          # Stage the file
          git add pr-${{ steps.pr.outputs.number }}/homepage-preview.png

          # Check if there are changes to commit
          if git diff --cached --quiet 2>/dev/null; then
            echo "No changes to commit - preview image is identical"
          else
            git commit -m "Add preview for PR #${{ steps.pr.outputs.number }}"
            git push origin preview-images
          fi

      - name: Post preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr.outputs.number }};
            const commitSha = context.payload.pull_request?.head.sha || context.sha;

            // Construct URL to the preview image
            const imageUrl = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/preview-images/pr-${prNumber}/homepage-preview.png`;
            const imageUrlWithParams = imageUrl + '?raw=true';

            // Find existing preview comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🎨 Blog Homepage Preview')
            );

            const commentBody = '## 🎨 Blog Homepage Preview\n\n' +
              'Here\'s how the homepage will look with your changes:\n\n' +
              '![Homepage Preview](' + imageUrlWithParams + ')\n\n' +
              '<details>\n' +
              '<summary>📊 Preview Information</summary>\n\n' +
              '- **PR**: #' + prNumber + '\n' +
              '- **Commit**: ' + commitSha.substring(0, 7) + '\n' +
              '- **Generated**: ' + new Date().toISOString() + '\n' +
              '- **Artifact**: Available in workflow run artifacts\n\n' +
              '</details>\n\n' +
              '> 💡 This preview is automatically generated when changes are made to posts, layouts, or the homepage.';

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
            }
