<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <style>
    :root {
      color-scheme: light dark;
      --page-bg: #fafbfd;
      --page-bg-accent: #f0f4f9;
      --card: rgba(255, 255, 255, 0.7);
      --card-hover: rgba(255, 255, 255, 0.9);
      --text: #1a202c;
      --text-secondary: #4a5568;
      --text-muted: #718096;
      --border: #e2e8f0;
      --border-hover: #cbd5e0;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-secondary: #ec4899;
      --accent-tertiary: #06b6d4;
      --accent-soft: rgba(99, 102, 241, 0.08);
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.1);
      --shadow-colored: 0 8px 32px rgba(99, 102, 241, 0.15);
      --radius: 12px;
      --radius-lg: 16px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page-bg: #0a0e1a;
        --page-bg-accent: #131826;
        --card: rgba(22, 27, 46, 0.6);
        --card-hover: rgba(26, 32, 53, 0.8);
        --text: #f7fafc;
        --text-secondary: #cbd5e0;
        --text-muted: #a0aec0;
        --border: rgba(226, 232, 240, 0.1);
        --border-hover: rgba(226, 232, 240, 0.2);
        --accent: #818cf8;
        --accent-hover: #a5b4fc;
        --accent-secondary: #f472b6;
        --accent-tertiary: #22d3ee;
        --accent-soft: rgba(129, 140, 248, 0.12);
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
        --shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.5);
        --shadow-colored: 0 8px 32px rgba(129, 140, 248, 0.2);
      }
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(5deg); }
    }

    @keyframes shimmer {
      0% { background-position: -1000px 0; }
      100% { background-position: 1000px 0; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: var(--text);
      background: linear-gradient(135deg, var(--page-bg) 0%, var(--page-bg-accent) 100%);
      background-size: 200% 200%;
      animation: gradientShift 15s ease infinite;
      line-height: 1.6;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 20% 80%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                  radial-gradient(circle at 80% 20%, rgba(236, 72, 153, 0.1) 0%, transparent 50%),
                  radial-gradient(circle at 40% 40%, rgba(6, 182, 212, 0.1) 0%, transparent 50%);
      animation: float 20s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    a {
      color: inherit;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    a:hover {
      color: var(--accent);
    }
  </style>
  {% if page.url == '/' %}
  <style>
    body.home {
      min-height: 100vh;
      padding: clamp(3rem, 8vw, 6rem) clamp(1.5rem, 5vw, 3rem);
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .home main {
      width: min(960px, 100%);
      display: flex;
      flex-direction: column;
      gap: clamp(3rem, 6vw, 4rem);
      position: relative;
      z-index: 1;
    }

    .home header {
      text-align: left;
      padding: clamp(2rem, 4vw, 3rem) 0;
      position: relative;
    }

    .home header h1 {
      font-size: clamp(2.5rem, 5vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-secondary) 50%, var(--accent-tertiary) 100%);
      background-size: 200% 200%;
      animation: gradientShift 8s ease infinite;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
      display: inline-block;
    }

    .home header h1::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent-secondary), var(--accent-tertiary));
      background-size: 200% 100%;
      animation: shimmer 3s linear infinite;
      border-radius: 2px;
      opacity: 0.6;
    }

    .home header .hero-description {
      font-size: clamp(1.1rem, 2vw, 1.25rem);
      line-height: 1.7;
      color: var(--text-secondary);
      max-width: 65ch;
      margin: 0;
    }

    .home .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
      gap: clamp(1.5rem, 3vw, 2rem);
    }

    .home .post-card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: clamp(1.75rem, 3vw, 2.25rem);
      background: var(--card);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }

    .home .post-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent-secondary), var(--accent-tertiary), var(--accent));
      background-size: 200% 100%;
      opacity: 0;
      transition: opacity 0.4s ease;
      animation: shimmer 3s linear infinite;
    }

    .home .post-card::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.1), transparent 70%);
      transform: translate(-50%, -50%);
      transition: width 0.6s ease, height 0.6s ease;
      pointer-events: none;
      z-index: 0;
    }

    .home .post-card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: var(--shadow-colored);
      border-color: var(--accent);
      background: var(--card-hover);
    }

    .home .post-card:hover::before {
      opacity: 1;
    }

    .home .post-card:hover::after {
      width: 300px;
      height: 300px;
    }

    .home .post-card > * {
      position: relative;
      z-index: 1;
    }

    .home .post-title {
      font-size: clamp(1.25rem, 2vw, 1.5rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.3;
    }

    .home .post-title a {
      text-decoration: none;
      color: var(--text);
      transition: color 0.2s ease;
    }

    .home .post-title a:hover {
      color: var(--accent);
    }

    .home .post-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 1rem;
      font-size: 0.875rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .home .post-meta span:not(:last-child)::after {
      content: '•';
      margin-left: 1rem;
      color: var(--border-hover);
    }

    .home .post-excerpt {
      color: var(--text-secondary);
      line-height: 1.7;
      font-size: 0.95rem;
      flex-grow: 1;
    }

    .home .post-footer {
      margin-top: auto;
      padding-top: 1.25rem;
    }

    .home .post-cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.2rem;
      font-size: 0.9rem;
      font-weight: 600;
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      background-size: 200% 100%;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
      position: relative;
      overflow: hidden;
    }

    .home .post-cta::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s ease;
    }

    .home .post-cta::after {
      content: '→';
      transition: transform 0.3s ease;
    }

    .home .post-cta:hover {
      gap: 0.75rem;
      background-position: 100% 0;
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
      transform: translateY(-2px);
    }

    .home .post-cta:hover::before {
      left: 100%;
    }

    .home .post-cta:hover::after {
      transform: translateX(4px);
    }

    @media (max-width: 768px) {
      body.home {
        padding: 2rem 1.25rem 3rem;
      }

      .home header {
        padding: 1.5rem 0;
      }

      .home .posts-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
  {% elsif page.layout == 'post' %}
  <style>
    body.post {
      min-height: 100vh;
      padding: clamp(3rem, 6vw, 5rem) clamp(1.5rem, 5vw, 3rem);
      display: flex;
      justify-content: center;
    }

    .post main {
      width: min(740px, 100%);
      position: relative;
      z-index: 1;
    }

    .post .post-article {
      position: relative;
      background: var(--card);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-colored);
      padding: clamp(2.5rem, 5vw, 3.5rem);
      display: flex;
      flex-direction: column;
      gap: clamp(1.75rem, 4vw, 2.5rem);
      overflow: hidden;
    }

    .post .post-article::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--accent), var(--accent-secondary), var(--accent-tertiary), var(--accent));
      background-size: 200% 100%;
      animation: shimmer 3s linear infinite;
    }

    .post .post-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-muted);
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin-bottom: 1rem;
      padding: 0.5rem 1rem;
      border-radius: 8px;
    }

    .post .post-back::before {
      content: '←';
      transition: transform 0.3s ease;
    }

    .post .post-back:hover {
      color: var(--accent);
      gap: 0.75rem;
      background: var(--accent-soft);
    }

    .post .post-back:hover::before {
      transform: translateX(-4px);
    }

    .post .post-label {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1.2rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      color: white;
      font-weight: 600;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: 20px;
      margin-bottom: 1rem;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
      position: relative;
      overflow: hidden;
    }

    .post .post-label::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      animation: shimmer 2s linear infinite;
    }

    .post .post-header h1 {
      margin: 0 0 1rem;
      font-size: clamp(2rem, 4vw, 2.75rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
      color: var(--text);
    }

    .post .post-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      font-size: 0.875rem;
      color: var(--text-muted);
      font-weight: 500;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .post .post-meta span:not(:last-child)::after {
      content: '•';
      margin-left: 1rem;
      color: var(--border-hover);
    }

    .post .post-summary {
      margin: 0;
      color: var(--text-secondary);
      line-height: 1.8;
      font-size: 1.125rem;
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--border);
    }

    .post .post-content {
      color: var(--text);
      line-height: 1.8;
      font-size: 1.0625rem;
    }

    .post .post-content a {
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-decoration: underline;
      text-decoration-color: var(--accent);
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
      transition: all 0.3s ease;
      position: relative;
    }

    .post .post-content a:hover {
      text-decoration-thickness: 3px;
      text-underline-offset: 4px;
    }

    .post .post-content > * + * {
      margin-top: 1.5rem;
    }

    .post .post-content h2 {
      color: var(--text);
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-top: 3rem;
      margin-bottom: 1rem;
      line-height: 1.3;
    }

    .post .post-content h3 {
      color: var(--text);
      font-size: 1.375rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-top: 2.5rem;
      margin-bottom: 0.875rem;
      line-height: 1.3;
    }

    .post .post-content h4 {
      color: var(--text);
      font-size: 1.125rem;
      font-weight: 600;
      margin-top: 2rem;
      margin-bottom: 0.75rem;
      line-height: 1.4;
    }

    .post .post-content p {
      margin: 1.5rem 0;
    }

    .post .post-content ul,
    .post .post-content ol {
      padding-left: 1.5rem;
      margin: 1.5rem 0;
    }

    .post .post-content li {
      margin: 0.5rem 0;
    }

    .post .post-content blockquote {
      margin: 2rem 0;
      padding: 1.25rem 1.5rem;
      border-left: 4px solid transparent;
      border-image: linear-gradient(180deg, var(--accent), var(--accent-secondary)) 1;
      background: linear-gradient(135deg, var(--accent-soft), rgba(236, 72, 153, 0.05));
      border-radius: 0 var(--radius) var(--radius) 0;
      font-style: italic;
      color: var(--text-secondary);
      position: relative;
      box-shadow: var(--shadow-sm);
    }

    .post .post-content blockquote p {
      margin: 0;
    }

    .post .post-content code {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      background: linear-gradient(135deg, var(--accent-soft), rgba(236, 72, 153, 0.08));
      color: var(--accent-hover);
      padding: 0.25em 0.5em;
      border-radius: 6px;
      font-size: 0.9em;
      border: 1px solid var(--border);
      box-shadow: 0 1px 3px rgba(99, 102, 241, 0.1);
    }

    .post .post-content pre {
      margin: 2rem 0;
      padding: 1.5rem;
      background: var(--card-hover);
      border: 2px solid var(--border);
      overflow-x: auto;
      border-radius: var(--radius);
      box-shadow: var(--shadow), inset 0 0 20px rgba(99, 102, 241, 0.03);
      position: relative;
    }

    .post .post-content pre::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent-secondary), var(--accent-tertiary));
      opacity: 0.5;
    }

    .post .post-content pre code {
      background: transparent;
      color: var(--text);
      padding: 0;
      border-radius: 0;
      font-size: 0.875rem;
    }

    .post .post-content img {
      max-width: 100%;
      height: auto;
      border-radius: var(--radius);
      margin: 2rem 0;
    }

    .post .post-content hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 3rem 0;
    }

    @media (max-width: 768px) {
      body.post {
        padding: 2rem 1.25rem 3rem;
      }

      .post .post-article {
        padding: 2rem 1.5rem;
      }

      .post .post-header h1 {
        font-size: 1.75rem;
      }

      .post .post-content {
        font-size: 1rem;
      }

      .post .post-content h2 {
        font-size: 1.5rem;
      }

      .post .post-content h3 {
        font-size: 1.25rem;
      }
    }
  </style>
  {% endif %}
</head>
<body class="{{ page.layout }}{% if page.url == '/' %} home{% endif %}">
  {{ content }}
</body>
</html>
