<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <style>
    :root {
      color-scheme: light dark;
      --page-bg: #f5f7fb;
      --page-bg-accent: #ecf0ff;
      --card: #ffffff;
      --card-muted: #f9fafe;
      --text: #101828;
      --text-muted: #475467;
      --border: #d0d5dd;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.12);
      --shadow: 0 20px 45px -30px rgba(15, 23, 42, 0.35);
      --radius-lg: 20px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page-bg: #0f172a;
        --page-bg-accent: #111c34;
        --card: rgba(15, 23, 42, 0.92);
        --card-muted: rgba(22, 30, 49, 0.85);
        --text: #f8fafc;
        --text-muted: #cbd5f5;
        --border: rgba(148, 163, 184, 0.35);
        --accent: #93c5fd;
        --accent-soft: rgba(96, 165, 250, 0.28);
        --shadow: 0 28px 60px -35px rgba(2, 6, 23, 0.6);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      background: var(--page-bg);
    }

    a {
      color: inherit;
    }
  </style>
  {% if page.url == '/' %}
  <style>
    body.home {
      background: radial-gradient(circle at top left, var(--page-bg-accent), transparent 55%),
                  var(--page-bg);
      min-height: 100vh;
      padding: clamp(3rem, 7vw, 5rem) clamp(1.75rem, 6vw, 3.5rem);
      display: flex;
      justify-content: center;
    }

    .home main {
      width: min(1040px, 100%);
      display: flex;
      flex-direction: column;
      gap: clamp(2.5rem, 6vw, 3.5rem);
    }

    .home header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: clamp(2.25rem, 5vw, 3.5rem);
      box-shadow: var(--shadow);
    }

    .home header .label {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.9rem;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 999px;
    }

    .home header h1 {
      margin: 1.2rem 0 1rem;
      font-size: clamp(2.5rem, 4vw, 3.1rem);
      letter-spacing: -0.02em;
    }

    .home header p {
      margin: 0;
      max-width: 48ch;
      line-height: 1.7;
      color: var(--text-muted);
      font-size: 1.08rem;
    }

    .home .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: clamp(1.5rem, 3vw, 2rem);
    }

    .home .post-card {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      padding: clamp(1.75rem, 3vw, 2.2rem);
      background: linear-gradient(180deg, var(--card) 0%, var(--card-muted) 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .home .post-card:hover,
    .home .post-card:focus-within {
      transform: translateY(-6px);
      box-shadow: 0 26px 55px -35px rgba(15, 23, 42, 0.45);
      border-color: var(--accent);
    }

    .home .post-title {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .home .post-title a {
      color: inherit;
      text-decoration: none;
    }

    .home .post-title a:hover,
    .home .post-title a:focus {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-thickness: 0.12em;
    }

    .home .post-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem 1.1rem;
      font-size: 0.93rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .home .post-excerpt {
      margin: 0;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .home .post-footer {
      margin-top: auto;
      display: flex;
      justify-content: flex-start;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .home .post-cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 0.95rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent);
      background: rgba(37, 99, 235, 0.1);
      border-radius: 999px;
      text-decoration: none;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .home .post-cta:hover,
    .home .post-cta:focus {
      color: #ffffff;
      background: var(--accent);
      transform: translateX(2px);
    }

    @media (max-width: 720px) {
      body.home {
        padding: 2.5rem 1.25rem 3rem;
      }

      .home header,
      .home .post-card {
        padding: 1.75rem 1.5rem 2rem;
      }
    }
  </style>
  {% elsif page.layout == 'post' %}
  <style>
    body.post {
      background: radial-gradient(circle at top right, var(--page-bg-accent), transparent 60%),
                  var(--page-bg);
      padding: clamp(2.5rem, 6vw, 4rem) clamp(1.25rem, 5vw, 3rem);
      display: flex;
      justify-content: center;
    }

    .post main {
      width: min(840px, 100%);
    }

    .post .post-article {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: clamp(18px, 4vw, 26px);
      box-shadow: var(--shadow);
      padding: clamp(2.2rem, 5vw, 3rem);
      display: flex;
      flex-direction: column;
      gap: clamp(1.5rem, 4vw, 2.5rem);
    }

    .post .post-back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--accent);
      text-decoration: none;
      margin-bottom: 0.8rem;
    }

    .post .post-back::before {
      content: '\2190';
      font-size: 1rem;
      transition: transform 0.2s ease;
    }

    .post .post-back:hover::before,
    .post .post-back:focus::before {
      transform: translateX(-2px);
    }

    .post .post-label {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.9rem;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      font-size: 0.82rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border-radius: 999px;
      margin-bottom: 0.6rem;
    }

    .post .post-header h1 {
      margin: 0.8rem 0 0.6rem;
      font-size: clamp(2.1rem, 4vw, 2.8rem);
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .post .post-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.5rem;
      font-size: 0.95rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .post .post-summary {
      margin: 0;
      color: var(--text-muted);
      line-height: 1.65;
      font-size: 1.05rem;
    }

    .post .post-content {
      color: var(--text);
      line-height: 1.75;
      font-size: 1.05rem;
    }

    .post .post-content a {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-thickness: 0.12em;
    }

    .post .post-content > * + * {
      margin-top: 1.2rem;
    }

    .post .post-content h2,
    .post .post-content h3,
    .post .post-content h4 {
      color: var(--text);
      margin-top: 2.2rem;
      margin-bottom: 0.8rem;
      line-height: 1.2;
    }

    .post .post-content blockquote {
      margin: 0;
      padding: 1.2rem 1.4rem;
      border-left: 4px solid var(--accent);
      background: rgba(37, 99, 235, 0.08);
      border-radius: 0 12px 12px 0;
      font-style: italic;
      color: var(--text);
    }

    .post .post-content code {
      font-family: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      background: rgba(15, 23, 42, 0.08);
      padding: 0.2rem 0.4rem;
      border-radius: 6px;
      font-size: 0.95em;
    }

    .post .post-content pre {
      padding: 1.2rem 1.4rem;
      background: rgba(15, 23, 42, 0.85);
      color: #f8fafc;
      overflow-x: auto;
      border-radius: 14px;
    }

    @media (max-width: 720px) {
      body.post {
        padding: 2.2rem 1rem 2.8rem;
      }

      .post .post-article {
        padding: 1.8rem 1.4rem 2rem;
      }
    }
  </style>
  {% endif %}
</head>
<body class="{{ page.layout }}{% if page.url == '/' %} home{% endif %}">
  {{ content }}
</body>
</html>
